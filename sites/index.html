<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Festivals</title>
<meta name="description" content="Lineup planners for upcoming festivals.">
<meta name="theme-color" content="#14110c">

<style>
  :root {
    --font-display: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;

    --bg: #ece3d0;
    --surface: #f8f3e8;
    --border: #cabb99;
    --text: #2a2116;
    --text-muted: #6c5c44;
    --accent: #d9480f;
    --accent-ink: #fff7ee;
    --shadow: 0 8px 24px -12px rgba(20, 15, 5, 0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14110c;
      --surface: #1c1811;
      --border: #3c3223;
      --text: #f0e6d4;
      --text-muted: #a8987d;
      --accent: #ff7a1e;
      --accent-ink: #1c1006;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14110c;
    --surface: #1c1811;
    --border: #3c3223;
    --text: #f0e6d4;
    --text-muted: #a8987d;
    --accent: #ff7a1e;
    --accent-ink: #1c1006;
    --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 18px 64px;
  }

  .topbar {
    padding: 40px 0 20px;
    border-bottom: 1px solid var(--border);
  }

  .brand-mark {
    display: block;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(2.1rem, 8vw, 3.2rem);
    letter-spacing: -0.01em;
    line-height: 0.95;
    text-transform: uppercase;
    color: var(--text);
  }

  .brand-sub {
    display: block;
    margin-top: 8px;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .year-heading {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 28px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover, .card:focus-visible {
    border-color: var(--accent);
    box-shadow: var(--shadow);
    outline: none;
  }

  .card-name {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.15rem;
    text-transform: uppercase;
    letter-spacing: -0.005em;
  }

  .card-meta {
    margin-top: 4px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .card-arrow {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 1.1rem;
    color: var(--accent);
  }

  .empty {
    margin-top: 24px;
    border: 1px dashed var(--border);
    padding: 22px;
    border-radius: 3px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <span class="brand-mark">Festivals</span>
    <span class="brand-sub">Lineup planners — pick favorites, avoid set conflicts</span>
  </header>

  <main>
    <div class="year-heading">2026</div>
    <div class="list">
      <a class="card" href="elements-2026/">
        <div>
          <div class="card-name">Elements</div>
          <div class="card-meta">Aug 7&ndash;9, 2026 &middot; Pocono Raceway, Long Pond PA</div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>
      <a class="card" href="lost-lands-2026/">
        <div>
          <div class="card-name">Lost Lands</div>
          <div class="card-meta">Sept 18&ndash;20, 2026 &middot; Legend Valley, Thornville OH</div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>
      <a class="card" href="oceans-calling-2026/">
        <div>
          <div class="card-name">Oceans Calling</div>
          <div class="card-meta">Sept 25&ndash;27, 2026 &middot; Ocean City Boardwalk, Ocean City MD</div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>
    </div>
  </main>
</div>

</body>
</html>
